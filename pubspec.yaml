name: oryksa
description: Official Flutter SDK for ORYKSA AI Employees. A ready in-app AI chat and voice (the same as the ORYKSA app), and a client for the ORYKSA API v1.
version: 1.1.0
homepage: https://developer.oryksa.com
repository: https://github.com/oryksa/oryksa-flutter
issue_tracker: https://github.com/oryksa/oryksa-flutter/issues
documentation: https://developer.oryksa.com/en/sdks
topics:
  - ai
  - chat
  - customer-support
  - voice
  - sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=0.13.6 <2.0.0"
  http_parser: ^4.0.2
  crypto: ^3.0.3
  record: ^6.0.0
  just_audio: ^0.10.4
  audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <6.0.0"

flutter:
